<button class="replay" type="button" aria-label="Replay the animation">Replay</button>
<script>
(function(){
  var STROKES=[[0], [1, 2, 3, 4, 5, 6, 7], [8]];
  var SPEED=2300;      /* px of pen travel per second, in artwork units */
  var LIFT=170;        /* pause when the pen lifts between strokes, ms */
  var START=250;       /* delay before the pen touches down, ms */
  var legs=[].slice.call(document.querySelectorAll('#legs .leg'));
  var len=legs.map(function(p){return p.getTotalLength();});
  var btn=document.querySelector('.replay');
  var raf=null;
  function set(i,v){ /* v: 0..1 drawn */
    var L=len[i]; legs[i].style.strokeDasharray=L+' '+(L+80);
    legs[i].style.strokeDashoffset=(L*(1-v)+ (v<=0?0.01:0));
    legs[i].style.visibility=v<=0?'hidden':'visible';
  }
  /* soft, hand-like speed curve: gentle start, steady middle, light lift */
  function easeHand(t){ return (1-Math.cos(Math.PI*Math.pow(t,0.92)))/2; }
  var plan=[], t0=START;
  STROKES.forEach(function(ids){
    var total=ids.reduce(function(s,i){return s+len[i];},0);
    var dur=Math.max(180,total/SPEED*1000);
    plan.push({ids:ids,total:total,start:t0,dur:dur});
    t0+=dur+LIFT;
  });
  var END=t0;
  function frame(now,begin){
    var t=now-begin;
    plan.forEach(function(s){
      var p=Math.min(1,Math.max(0,(t-s.start)/s.dur));
      var d=easeHand(p)*s.total;
      s.ids.forEach(function(i){
        var v=Math.min(1,Math.max(0,d/len[i])); d-=len[i]; set(i,v);
      });
    });
    if(t<END) raf=requestAnimationFrame(function(n){frame(n,begin);});
    else btn.classList.add('show');
  }
  function play(){
    cancelAnimationFrame(raf); btn.classList.remove('show');
    legs.forEach(function(_,i){set(i,0);});
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){legs.forEach(function(_,i){set(i,1);});btn.classList.add('show');return;}
    requestAnimationFrame(function(n){frame(n,n);});
  }
  btn.addEventListener('click',play);
  document.querySelector('.mark').addEventListener('click',play);
  play();
})();
</script>
