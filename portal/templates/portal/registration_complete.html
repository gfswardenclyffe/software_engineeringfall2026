*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#151515;font-family:Inter,Arial,sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;border:1px solid #151515}
.brand{padding:48px;border-right:1px solid #151515;display:flex;flex-direction:column;justify-content:space-between}
.brand img{width:260px}.by{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.form{padding:48px;background:#fff;display:flex;flex-direction:column;justify-content:center}
.langs{display:flex;gap:0;margin-bottom:28px}.langs button{border:1px solid #151515;border-right:0;background:#fff;padding:8px 12px;font-weight:800}.langs button:last-child{border-right:1px solid #151515}.langs .active{background:#151515;color:#fff}
h1{font-size:52px;letter-spacing:-.04em;margin:0 0 12px}.sub{color:#666;margin:0 0 28px;line-height:1.5}
form p{margin:0 0 18px}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input{width:100%;padding:13px;border:1px solid #151515;background:#fff}
.helptext{display:block;color:#777;font-size:12px;line-height:1.4;margin-top:5px}ul.errorlist{color:#a40000;padding-left:18px}
.btn{display:inline-block;background:#ee6c35;border:1px solid #151515;padding:14px 20px;font-weight:800;cursor:pointer;text-decoration:none;color:#151515}
.links{margin-top:18px;font-size:14px}.links a{color:#151515}
@media(max-width:850px){.shell{grid-template-columns:1fr}.brand{border-right:0;border-bottom:1px solid #151515;min-height:260px}}
