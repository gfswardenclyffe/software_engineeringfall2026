{% load static %}
<header class="galiel-top">
  <a class="galiel-brand" href="{% url 'home' %}" aria-label="Galiel by Wardenclyffe — Home">
    <img class="galiel-signature" src="{% static 'portal/galiel-signature.svg' %}" alt="Galiel">
    <span class="galiel-by"><span>by</span> WARDENCLYFFE</span>
  </a>
  <div class="galiel-top-right">
    {% if user.is_authenticated %}
      <span class="galiel-user">{{ user.get_full_name|default:user.email }}</span>
    {% endif %}
    {% with current=request.GET.lang|default:"en" %}
    <nav class="galiel-languages" aria-label="Language">
      <a href="?lang=en" lang="en" {% if current == "en" %}aria-current="page"{% endif %}>EN</a>
      <a href="?lang=es" lang="es" {% if current == "es" %}aria-current="page"{% endif %}>ES</a>
      <a href="?lang=fr" lang="fr" {% if current == "fr" %}aria-current="page"{% endif %}>FR</a>
    </nav>
    {% endwith %}
    {% if user.is_authenticated %}
    <a class="galiel-signout" href="{% url 'dashboard' %}">Workspace</a>
    <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="galiel-signout" type="submit">Sign out</button></form>
    {% else %}
    <a class="galiel-signout" href="{% url 'login' %}">Sign in</a>
    {% endif %}
  </div>
</header>
