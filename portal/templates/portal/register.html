<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dfe4ea;color:#171717;font-family:Arial,Helvetica,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;border:3px solid #171717}.brand{padding:48px;border-right:3px solid #171717;background:#e5e8ec}.form{padding:48px;background:#f7f7f7}.kicker{font-size:13px;margin-bottom:120px}.brand h1,.form h1{font-size:54px;line-height:.95;margin:0 0 22px}.brand p,.form p{font-size:17px;line-height:1.5}.form form p{margin:0 0 20px}.form input{width:100%;padding:14px;border:2px solid #171717;background:white}.btn{display:inline-block;background:#ff5a12;color:#171717;border:0;padding:16px 24px;font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:24px}@media(max-width:800px){.shell{grid-template-columns:1fr}.brand{border-right:0;border-bottom:3px solid #171717}}
</style></head><body>
<div class="shell"><section class="brand"><div class="kicker">GALIEL by Wardenclyffe</div><h1>CREATE<br>ACCOUNT.</h1><p>Start a client account to request services and manage work with Wardenclyffe.</p></section>
<section class="form"><div class="kicker">WARDENCLYFFE CLIENT MANAGEMENT PLATFORM</div><h1>New client.</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">CREATE ACCOUNT →</button></form><a class="back" href="{% url 'login' %}">Already have an account?</a><br><a class="back" href="{% url 'home' %}">← Back home</a></section></div>
</body></html>
