name: Django checks

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests-do-not-use-in-production
          GALIEL_ENV: "development"
          DJANGO_DEBUG: "False"
        run: python manage.py check
      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests-do-not-use-in-production
          GALIEL_ENV: "development"
          DJANGO_DEBUG: "False"
        run: python manage.py test portal --verbosity 2

      - name: Production-like hardening preflight (no live secrets)
        env:
          GALIEL_ENV: production
        run: |
          install -d -m 700 "$HOME/galiel_env"
          /usr/bin/env python - <<'PY'
          import os
          from pathlib import Path
          import secrets
          p = Path.home() / "galiel_env" / ".env"
          fd = os.open(str(p), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as handle:
              handle.write("GALIEL_ENV=production\n")
              handle.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n")
              handle.write("DJANGO_DEBUG=False\n")
              handle.write("DJANGO_ALLOWED_HOSTS=galiel.wardenclyffefirm.com,www.galiel.wardenclyffefirm.com\n")
          PY
          python manage.py check --deploy
          python manage.py test portal.tests_security_preflight --verbosity 2
