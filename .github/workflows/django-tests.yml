name: Django checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests-do-not-use-in-production
          GALIEL_ENV: "development"
          DJANGO_DEBUG: "False"
        run: python manage.py check
      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests-do-not-use-in-production
          GALIEL_ENV: "development"
          DJANGO_DEBUG: "False"
        run: python manage.py test portal --verbosity 2
