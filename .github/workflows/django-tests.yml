name: Django checks (Python 3.9, production-compatible schema)

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate ephemeral CI-only signing key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from secrets import token_urlsafe; print(token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Django system check
        run: python manage.py check
      - name: Verify only approved migrations exist
        run: |
          test ! -f portal/migrations/0012_pricing_research.py
          python manage.py makemigrations --check --dry-run
      - name: Run complete portal and operations tests
        run: python manage.py test portal galiel_ops --noinput --verbosity 2
