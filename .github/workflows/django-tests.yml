name: Django checks (clean schema, portal + operations)

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Python environment
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Generate ephemeral CI-only secret
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'from secrets import token_urlsafe; print(token_urlsafe(48))')" >> "$GITHUB_ENV"
      - name: Audit tracked files for private data and known credentials
        run: python3 scripts/audit_public_tree.py
      - name: Django check
        run: .venv/bin/python manage.py check
      - name: Verify no pricing migration
        run: |
          test ! -f portal/migrations/0012_pricing_research.py
          .venv/bin/python manage.py makemigrations --check --dry-run
      - name: Validate X-Ray JavaScript syntax
        run: node --check portal/static/portal/galiel-xray.js
      - name: Verify mirrored Apache static assets
        run: |
          cmp portal/static/portal/galiel-xray.js static/portal/galiel-xray.js
          cmp portal/static/portal/galiel-xray.css static/portal/galiel-xray.css
          cmp portal/static/portal/galiel-xray-stops.json static/portal/galiel-xray-stops.json
      - name: Run all portal and operations tests
        run: .venv/bin/python manage.py test portal galiel_ops --noinput --verbosity 2
